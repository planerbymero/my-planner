<script>window.checkPlannerPassword = function(){
  var field = document.getElementById("loginPass");
  var error = document.getElementById("loginError");
  function normalizePassword(value){
    return String(value || "").normalize("NFKC").toLowerCase()
      .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")
      .replace(/\u0640/g, "")
      .replace(/[\u0649\u06CC\u06D2]/g, "\u064A")
      .replace(/[\s\u200B-\u200F\u202A-\u202E\u2060\uFEFF]+/g, "");
  }
  var entered = normalizePassword(field.value);
  var accepted = ["hi mero", "هاي ميرو", "هاى ميرو"].map(normalizePassword);
  if (accepted.indexOf(entered) !== -1) {
    document.body.classList.remove("locked");
    document.getElementById("loginGate").hidden = true;
    error.textContent = "";
    field.value = "";
  } else {
    error.textContent = field.value.trim()
      ? "كلمة المرور غير صحيحة، حاول مرة تانية"
      : "اكتب كلمة المرور الأول";
    error.style.display = "block";
    field.focus();
    field.select();
  }
  return false;
};

 o+='<div class="nav">'+(x>0?'<a class="card" style="flex:1" href="#'+P[x-1].id+'">'+T(U.prev)+": "+T(P[x-1].t)+"</a>":"<span></span>")+(x<P.length-1?'<a class="card" style="flex:1" href="#'+P[x+1].id+'">'+T(U.next)+": "+T(P[x+1].t)+"</a>":"")+"</div>";
 return o}
function home(){
 var o='<div class="cover"><div style="font-size:2rem">♡</div><h1>'+T(U.ttl)+"</h1><p>"+T(U.sub)+"</p><small>"+T(U.step)+"</small></div>";
 Object.keys(G).forEach(function(g){o+="<h4>"+T(G[g])+'</h4><div class="grid">';
  P.forEach(function(p){if(p.g==g)o+='<a class="card" href="#'+p.id+'"><i>'+p.i+"</i>"+T(p.t)+"</a>"});o+="</div>"});
 return o+'<div class="cover" style="margin-top:1.5rem">👑<h3>'+T(U.end)+"</h3><p>"+T(U.end2)+"</p></div>"+'<section class="backupBox"><b>حفظ بياناتك</b><p>يُحفظ المخطط تلقائيًا على هذا الجهاز في نفس المتصفح. استخدم النسخة الاحتياطية للاحتفاظ بنسخة إضافية أو لنقل بياناتك.</p><button type="button" id="backupBtn">تنزيل نسخة احتياطية</button><button type="button" id="restoreBtn">استعادة نسخة احتياطية</button></section>'}
function tot(){var t=0;$$(".amt").forEach(function(e){t+=+e.value||0});var e=$("#tot");if(e)e.textContent=t}
function pc(e){e.nextElementSibling.textContent=(e.value||0)+"%"}
function render(top){
 var id=location.hash.slice(1),p=P.filter(function(x){return x.id==id})[0];
 document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";
 $("#lg").textContent=lang=="ar"?"EN":"عربي";
 $("#ttl").textContent=p?T(p.t):T(U.ttl);
 $("#app").innerHTML=p?page(p):home();
 $$("[data-k]").forEach(function(e){var v=S[e.dataset.k];if(e.type=="checkbox")e.checked=!!v;else{e.value=v||(e.type=="range"?0:"");if(e.type=="range")pc(e)}});
 tot();if(top)scrollTo(0,0)}
document.addEventListener("input",function(ev){var e=ev.target,k=e.dataset&&e.dataset.k;if(!k)return;
 S[k]=e.type=="checkbox"?e.checked:e.value;save();if(e.type=="range")pc(e);if(e.classList.contains("amt"))tot()});
document.addEventListener("change",function(ev){var e=ev.target;
 if(e.id=="dt"&&e.value){date=e.value;render()}
 if(e.id=="mp"&&e.value){S._mon=e.value;save();render()}
 if(e.id=="restoreFile"){importBackup(e.files&&e.files[0]);e.value=""}});
document.addEventListener("click",function(ev){var e=ev.target;
 if(e.id=="backupBtn"){exportBackup();return}
 if(e.id=="restoreBtn"){$("#restoreFile").click();return}
 if(e.id=="lg"){lang=lang=="ar"?"en":"ar";S._l=lang;save();render()}
 if(e.id=="clr"){if(e.dataset.s){var p=P.filter(function(x){return x.id==location.hash.slice(1)})[0],q=pre(p)+".";
   Object.keys(S).forEach(function(k){if(k.indexOf(q)==0)delete S[k]});save();render()}
  else{e.dataset.s=1;e.textContent=T(U.sure)}}});
window.addEventListener("hashchange",function(){render(1)});
window.addEventListener("pagehide",function(){save()});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")save()});
render();
if(storageReady)setSaveStatus("✓ يتم حفظ تغييراتك تلقائيًا على هذا الجهاز",false);
else setSaveStatus("تعذّر الوصول إلى مساحة الحفظ في المتصفح. استخدم نسخة احتياطية بعد إدخال بياناتك.",true);
</script>
